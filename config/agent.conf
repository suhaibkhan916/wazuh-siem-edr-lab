<!-- Centralised agent configuration, pushed from the manager to every agent in the "default" group. -->
<agent_config>

  <!-- The packaged Linux agent does not collect authentication logs by default. Without this,
       sshd failures and useradd events never reach the manager and nothing can alert on them. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <syscheck>
    <!-- Real-time file integrity monitoring: alerts arrive within seconds, not on the 12-hour scan. -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/cron.d,/lab/watched</directories>
  </syscheck>

</agent_config>
