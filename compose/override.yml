# Layered on top of upstream wazuh-docker single-node. Upstream publishes every port on all
# interfaces with default credentials; this publishes only what a person at this machine needs,
# bound to loopback, and swaps in the manager config generated by lab.py.
services:
  wazuh.manager:
    ports: !override
      - "127.0.0.1:55000:55000"
    volumes:
      - type: bind
        source: ${LAB_ROOT}/build/wazuh_manager.conf
        target: /wazuh-config-mount/etc/ossec.conf

  wazuh.indexer:
    ports: !override
      - "127.0.0.1:9200:9200"

  wazuh.dashboard:
    ports: !override
      - "127.0.0.1:8443:5601"
